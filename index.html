<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación reCAPTCHA</title>
  
  <!-- Script oficial de Google reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .contenedor {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .g-recaptcha {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #003d80;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h2>Confirmación de Seguridad</h2>
    <p>Por favor, completa la verificación para continuar:</p>

    <form id="formularioCaptcha">
      <!-- Casilla del reCAPTCHA con tu clave de sitio v2 -->
      <div class="g-recaptcha" data-sitekey="6LdjCuQtAAAAACO4F6f7RAMVzFOSvTz0l-mnLMDm"></div>

      <!-- Botón de envío -->
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    document.getElementById("formularioCaptcha").addEventListener("submit", function(event) {
      // Detener el envío por defecto para verificar el Captcha
      event.preventDefault();

      // Obtener la respuesta del reCAPTCHA
      var captchaResponse = grecaptcha.getResponse();

      if (captchaResponse.length === 0) {
        // Si la respuesta está vacía, el usuario no ha marcado la casilla
        alert("Por favor, marca la casilla 'No soy un robot' antes de continuar.");
      } else {
        // Si el captcha fue completado correctamente
        alert("¡Verificación exitosa! Puedes continuar.");
        
        // Aquí puedes agregar la acción que deseas ejecutar o redirigir
      }
    });
  </script>

</body>
</html>
